name: Build APK

on:
  push:
    paths:
      - 'www/**'
      - 'scripts/**'
      - 'native/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: .cache
          key: vosk-model-small-ru-0.22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npm run android:init

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          npm run android:build
          cp android/app/build/outputs/apk/debug/app-debug.apk akkordy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: akkordy-apk
          path: akkordy.apk

      - name: Publish to release "apk-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Аккорды — последняя сборка APK
          prerelease: true
          files: akkordy.apk
